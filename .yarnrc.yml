nodeLinker: node-modules

# Refuse to resolve a package version published less than seven days ago.
# A freshly published version is the window in which a compromised maintainer
# account or a typosquat is still unreported, so waiting it out removes the
# most common supply-chain path without pinning anything by hand.
# See https://yarnpkg.com/configuration/yarnrc#npmMinimalAgeGate
npmMinimalAgeGate: "7d"
