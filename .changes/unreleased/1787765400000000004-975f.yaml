kind: 'Fixed'
body: 'fixed the `main` pipeline''s `quality:knip` job, which reported thirteen of the sixteen files under `src/` as dead code. They are not: oclif discovers commands by reading a directory at run time, so nothing ever imports `src/commands/start.ts`, and the whole graph hanging off it looked unreachable. A `knip.jsonc` now declares the command files as entry points and enables knip''s oclif plugin, which this project''s pre-`@oclif/core` layout did not trigger on its own. The genuinely unused dependencies it also found -- `axios`, `sudo-prompt`, `yaml`, `@oclif/test` and `globby` -- were removed. Removing `@oclif/test` exposed that `@types/lodash` had only ever reached the build as a phantom dependency of one of its transitive packages, even though `tsconfig.json` requires it, so it is now declared directly. `ts-node` was likewise dangling: the `test` script globs `test/**/*.test.ts` but nothing taught mocha to load TypeScript, so a `.mocharc.json` now wires it up and the script can actually run a TypeScript test.'
